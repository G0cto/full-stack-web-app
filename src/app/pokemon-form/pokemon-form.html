
<div class="pokemon-page">

  <form
    class="pokemon-form"
    [formGroup]="pokemonForm"
    (ngSubmit)="savePokemon()">

    <div class="form-header">
      <div class="pokeball">◎</div>
    </div>

    <div class="form-body">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name">

      <label for="type">Type</label>
      <input id="type" type="text" formControlName="type">

      <label for="level">Level</label>
      <input id="level" type="number" formControlName="level">

      <label for="nature">Nature</label>
      <input id="nature" type="text" formControlName="nature">

      <button class="save-button" type="submit">
        {{ editingId ? 'Update Pokémon' : 'Save Pokémon' }}
      </button>

      @if (editingId) {
        <button
          class="cancel-button"
          type="button"
          (click)="cancelEdit()">
          Cancel
        </button>
      }

      @if (message) {
        <p role="status">{{ message }}</p>
      }
    </div>
  </form>

  <h2 class="section-title">Saved Pokémon</h2>

  <div class="pokemon-list">
    @for (pokemon of pokemonService.pokemonList(); track pokemon._id) {
      <div class="pokemon-card">
        <p>
          <strong>{{ pokemon.name }}</strong>
          (Type: {{ pokemon.type }},
          Level: {{ pokemon.level }},
          Nature: {{ pokemon.nature }})
        </p>

        <div class="card-actions">
          <button
            class="edit-button"
            type="button"
            (click)="editPokemon(pokemon)">
            Edit
          </button>

          <button
            class="delete-button"
            type="button"
            (click)="deletePokemon(pokemon._id)">
            Delete
          </button>
        </div>
      </div>
    } @empty {
      <p>No saved Pokémon yet.</p>
    }
  </div>

</div>
